<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechVai - Lovable Extension - Side Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="sp-header">
    <div class="sp-brand" style="display:flex;align-items:center;gap:6px;">
      <span class="sp-brand-text" style="display:flex;align-items:center;gap:7px;"><img src="images/logo_circle_tight.png" style="width:36px;height:34px;border-radius:50%;object-fit:contain;" alt="Logo"> TechVai - Lovable Extension</span>
      <span class="sp-badge">PRO</span>
    </div>
    <div class="sp-header-actions">
      <button class="sp-icon-btn sp-theme-btn" title="Theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="sp-icon-btn sp-lite-btn" title="Lite Mode">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/><path d="M12 14a2 2 0 0 0-2 2"/></svg>
      </button>
    </div>
  </div>

  <div class="sp-body" id="sp-body">
    <div class="sp-license-gate" id="sp-loading" style="padding:40px 0;text-align:center">
      <p style="color:var(--ql-text-muted)">Loading...</p>
    </div>
  </div>

  <div class="sp-footer">
    <button class="sp-back-to-popup" id="sp-back-to-popup" title="Back to floating mode">
      Popup
    </button>
    <span class="sp-footer-badge">TV v6.0.13</span>
  </div>

  <script src="jszip.min.js"></script>
  <script src="hwFingerprint.js"></script>
  <script src="sidepanel-templates.js"></script>
  <script src="sounds.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
